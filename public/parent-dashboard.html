<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Family Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
:root{
  --ink:#1c2430;--ink-soft:#3c4454;--muted:#726c5e;--paper:#faf6ee;--paper-deep:#f2ead9;
  --surface:#ffffff;--line:#e7dfcd;--line-soft:#efe8d8;--gold:#b5822a;--gold-deep:#8f671f;
  --gold-tint:#f6ead1;--teal:#1f6f63;--teal-tint:#e2f0ec;--rose:#b3435a;--rose-tint:#f8e6e9;
  --amber:#c07a1f;--amber-tint:#f8ecd6;--radius-lg:22px;--radius-md:16px;--radius-sm:10px;
  --shadow-soft:0 1px 2px rgba(28,36,48,.04), 0 8px 24px -12px rgba(28,36,48,.12);
  --shadow-lift:0 18px 40px -20px rgba(28,36,48,.28);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--gold-tint);}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#d8cfb8;border-radius:9999px;}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

.shell{display:flex;min-height:100vh;}
.rail{width:252px;flex-shrink:0;background:var(--ink);color:#e9e4d6;display:flex;flex-direction:column;padding:26px 18px;position:sticky;top:0;height:100vh;}
.rail-brand{display:flex;align-items:center;gap:11px;padding:0 6px 22px;border-bottom:1px solid rgba(233,228,214,.12);margin-bottom:18px;}
.rail-brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(155deg,var(--gold),var(--gold-deep));display:flex;align-items:center;justify-content:center;color:#1c1608;font-weight:700;font-size:15px;flex-shrink:0;}
.rail-brand .name{font-family:'Fraunces',serif;font-size:16px;line-height:1.15;font-weight:600;color:#fff;}
.rail-brand .sub{font-size:11px;color:#a79f8c;margin-top:1px;}
.rail-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
.rail-nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:none;background:none;color:#c3bca8;border-radius:11px;cursor:pointer;font-size:14px;font-weight:500;text-align:left;transition:background .15s,color .15s;}
.rail-nav button i{width:18px;text-align:center;font-size:15px;opacity:.85;}
.rail-nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
.rail-nav button.active{background:rgba(181,130,42,.18);color:#f3d99a;}
.rail-nav button .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--rose);display:none;}
.rail-nav button.has-alert .dot{display:block;}
.rail-foot{border-top:1px solid rgba(233,228,214,.12);padding-top:14px;margin-top:10px;}
.rail-child{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:10px;}
.rail-child select{background:transparent;border:none;color:#f1ecdd;font-size:13px;font-weight:600;width:100%;cursor:pointer;}
.rail-child select option{color:#1c2430;}
.rail-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(155deg,var(--teal),#123f38);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.rail-logout{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:11px;color:#d7a9a9;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;width:100%;}
.rail-logout:hover{background:rgba(179,67,90,.15);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:none;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
.topbar .t-title{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
.topbar .t-actions{display:flex;align-items:center;gap:14px;}
.icon-btn{position:relative;background:none;border:none;font-size:18px;color:var(--ink-soft);cursor:pointer;padding:4px;}
.icon-btn .badge{position:absolute;top:-3px;right:-4px;background:var(--rose);color:#fff;font-size:9px;font-weight:700;border-radius:9999px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.topbar .t-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(155deg,var(--teal),#123f38);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:none;cursor:pointer;}

.view{padding:30px 40px 60px;max-width:960px;width:100%;margin:0 auto;flex:1;}
.view-enter{animation:viewIn .32s ease;}
@keyframes viewIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.eyebrow{font-size:12.5px;color:var(--muted);margin:0 0 4px;}
.page-head{margin-bottom:24px;}
.page-head h1{font-size:26px;margin:0 0 4px;font-weight:600;}
.page-head p{margin:0;color:var(--muted);font-size:14px;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-soft);}
.pad{padding:20px;}
.hairline{border-top:1px solid var(--line-soft);}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:9999px;}
.pill-gold{background:var(--gold-tint);color:var(--gold-deep);}
.pill-teal{background:var(--teal-tint);color:var(--teal);}
.pill-rose{background:var(--rose-tint);color:var(--rose);}
.pill-amber{background:var(--amber-tint);color:var(--amber);}
.pill-muted{background:var(--paper-deep);color:var(--muted);}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:600;font-size:13.5px;border:none;cursor:pointer;transition:transform .12s, background .15s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink);color:#f3ead0;}
.btn-primary:hover{background:#2a3242;}
.btn-ghost{background:var(--paper-deep);color:var(--ink);}
.btn-ghost:hover{background:#ece2c8;}
.btn-gold{background:var(--gold);color:#1c1608;}
.btn-gold:hover{background:var(--gold-deep);color:#fff;}

.select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;}

.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty i{font-size:34px;opacity:.35;display:block;margin-bottom:12px;}
.empty p{margin:2px 0;font-size:14px;}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;}
@keyframes spin{to{transform:rotate(360deg);}}

.hero{background:var(--ink);color:#f3ead0;border-radius:var(--radius-lg);padding:30px 32px;position:relative;overflow:hidden;margin-bottom:22px;}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(181,130,42,.35),transparent 70%);}
.hero .greet{font-family:'Fraunces',serif;font-size:27px;font-weight:600;margin:0 0 6px;position:relative;}
.hero .greet-sub{font-size:13.5px;color:#c9c0a5;position:relative;max-width:520px;line-height:1.5;}
.hero .hero-gold-rule{width:52px;height:3px;background:var(--gold);border-radius:2px;margin:14px 0 0;position:relative;}

.child-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:20px;}
.child-chip{flex-shrink:0;display:flex;align-items:center;gap:9px;padding:8px 14px 8px 8px;border-radius:9999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s, background .15s;}
.child-chip.active{border-color:var(--gold);background:var(--gold-tint);}
.child-chip .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(155deg,var(--teal),#123f38);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.child-chip .cn{font-size:13px;font-weight:600;white-space:nowrap;}
.child-chip .cc{font-size:10.5px;color:var(--muted);white-space:nowrap;}

.tile-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;margin-bottom:22px;}
.tile{border-radius:var(--radius-md);padding:18px;position:relative;overflow:hidden;}
.tile .tk{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;opacity:.75;}
.tile .tv{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:6px 0 2px;}
.tile .ts{font-size:12px;opacity:.8;}
.tile-balance{background:var(--ink);color:#f3ead0;}
.tile-balance .tk{color:#c9c0a5;}
.tile-attend{background:var(--teal-tint);color:var(--teal);}
.tile-grade{background:var(--gold-tint);color:var(--gold-deep);}

.section-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;margin:0 0 12px;}
.section-title .link{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--gold-deep);cursor:pointer;}

.feed-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft);}
.feed-item:last-child{border-bottom:none;}
.feed-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.feed-body{min-width:0;}
.feed-title{font-weight:600;font-size:13.5px;margin:0;}
.feed-desc{font-size:12.5px;color:var(--muted);margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.feed-date{font-size:11px;color:var(--muted);margin-top:3px;}

.term-bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.grade-ring-wrap{display:flex;align-items:center;gap:18px;}
.grade-ring{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;}
.grade-ring .inner{width:70px;height:70px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.grade-ring .inner b{font-family:'Fraunces',serif;font-size:19px;line-height:1;}
.grade-ring .inner span{font-size:9.5px;color:var(--muted);margin-top:2px;}

.subject-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line-soft);gap:10px;}
.subject-row:last-child{border-bottom:none;}
.subject-name{font-size:13.5px;font-weight:600;}
.subject-score{font-size:12px;color:var(--muted);}
.grade-chip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.g-A,.g-D1,.g-D2{background:#e1f3e6;color:#1f7a3d;}
.g-B,.g-C3,.g-C4{background:var(--teal-tint);color:var(--teal);}
.g-C,.g-C5,.g-C6{background:var(--amber-tint);color:var(--amber);}
.g-D,.g-P7{background:#fbe7d3;color:#c05f1f;}
.g-E,.g-P8{background:var(--rose-tint);color:var(--rose);}
.g-F,.g-F9{background:#f6dade;color:#93293e;}

.donut-wrap{display:flex;align-items:center;gap:20px;}
.donut{width:108px;height:108px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.donut .hole{width:78px;height:78px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut .hole b{font-family:'Fraunces',serif;font-size:18px;}
.donut .hole span{font-size:9.5px;color:var(--muted);}
.money-row{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;}
.money-row b{font-weight:700;}

.balance-banner{background:var(--rose-tint);border:1px solid #eccbd1;border-radius:var(--radius-md);padding:15px 18px;display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.balance-banner i{font-size:20px;color:var(--rose);}
.balance-banner .bb-title{font-weight:700;font-size:13.5px;color:#8f2f42;}
.balance-banner .bb-sub{font-size:12px;color:#a13d51;margin-top:1px;}

.accordion{border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;margin-bottom:12px;}
.accordion-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:var(--paper-deep);cursor:pointer;font-weight:700;font-size:13px;gap:10px;}
.accordion-head .ah-right{display:flex;align-items:center;gap:10px;font-weight:500;font-size:12.5px;color:var(--muted);flex-shrink:0;text-align:right;}
.accordion-body{padding:0 16px;max-height:0;overflow:hidden;transition:max-height .25s ease;}
.accordion.open .accordion-body{max-height:1600px;padding:6px 16px 12px;}
.accordion-head i.chev{transition:transform .2s;}
.accordion.open .accordion-head i.chev{transform:rotate(180deg);}
.item-line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13px;gap:10px;}
.item-line:last-child{border-bottom:none;}
.item-line .il-name{font-weight:600;}
.item-line .il-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}

.payment-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
.payment-row:last-child{border-bottom:none;}
.payment-row .pr-receipt{font-weight:600;}
.payment-row .pr-date{font-size:11.5px;color:var(--muted);}

.attend-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
.astat{border-radius:var(--radius-md);padding:14px;text-align:center;}
.astat b{font-family:'Fraunces',serif;font-size:22px;display:block;}
.astat span{font-size:11.5px;color:var(--muted);}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow{text-align:center;font-size:10.5px;color:var(--muted);font-weight:700;padding-bottom:4px;}
.cal-cell{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--paper-deep);color:var(--muted);}
.cal-cell.present{background:var(--teal-tint);color:var(--teal);}
.cal-cell.absent{background:var(--rose-tint);color:var(--rose);}
.cal-cell.empty{background:transparent;}

.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.chip-filter{padding:6px 13px;border-radius:9999px;border:1.5px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);}
.chip-filter.active{border-color:var(--ink);background:var(--ink);color:#f3ead0;}
.event-card{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--radius-md);margin-bottom:10px;background:var(--surface);}
.event-date-block{width:52px;flex-shrink:0;text-align:center;border-radius:12px;background:var(--paper-deep);padding:8px 4px;}
.event-date-block .mon{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;}
.event-date-block .day{font-family:'Fraunces',serif;font-size:20px;font-weight:700;line-height:1;}
.event-info h4{margin:0 0 3px;font-size:14px;font-weight:700;}
.event-info p{margin:0;font-size:12.5px;color:var(--muted);}
.event-meta{display:flex;gap:12px;margin-top:6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;}

.announce-card{padding:16px;border:1px solid var(--line);border-radius:var(--radius-md);margin-bottom:10px;background:var(--surface);}
.announce-card h4{margin:0 0 5px;font-size:14px;font-weight:700;}
.announce-card p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.55;}
.announce-meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;}

.msg-shell{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;background:var(--surface);height:560px;max-height:70vh;}
.msg-thread-head{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;background:var(--paper-deep);}
.msg-thread-head .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(155deg,var(--teal),#123f38);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.msg-scroll{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;}
.bubble{max-width:72%;padding:9px 14px;border-radius:16px;font-size:13.5px;line-height:1.4;}
.bubble.me{align-self:flex-end;background:var(--ink);color:#f3ead0;border-bottom-right-radius:5px;}
.bubble.them{align-self:flex-start;background:var(--paper-deep);color:var(--ink);border-bottom-left-radius:5px;}
.bubble .btime{display:block;font-size:9.5px;opacity:.6;margin-top:3px;}
.msg-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);}
.msg-input-row input{flex:1;border:1px solid var(--line);border-radius:9999px;padding:10px 16px;font-size:13.5px;background:var(--paper);}
.msg-send{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#f3ead0;border:none;cursor:pointer;flex-shrink:0;}

.profile-child-row{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line-soft);}
.profile-child-row:last-child{border-bottom:none;}
.profile-child-row .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(155deg,var(--teal),#123f38);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.info-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
.info-line:last-child{border-bottom:none;}
.info-line span:first-child{color:var(--muted);}
.info-line span:last-child{font-weight:600;}

.sheet-overlay{position:fixed;inset:0;background:rgba(28,24,16,.4);backdrop-filter:blur(3px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding-top:64px;}
.sheet-overlay.show{display:flex;}
.sheet{background:var(--surface);border-radius:20px;width:92%;max-width:400px;max-height:74vh;overflow-y:auto;padding:18px;animation:sheetIn .25s ease;}
@keyframes sheetIn{from{opacity:0;transform:translateY(-14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line);}
.sheet-head h3{margin:0;font-size:16px;}
.sheet-head button{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:100;box-shadow:0 -6px 18px rgba(28,24,16,.06);}
.bottom-nav .bn-row{display:flex;justify-content:space-around;}
.bottom-nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:9.5px;font-weight:600;padding:4px 6px;cursor:pointer;position:relative;min-width:52px;}
.bottom-nav button i{font-size:18px;}
.bottom-nav button.active{color:var(--gold-deep);}
.bottom-nav button .bnbadge{position:absolute;top:-1px;right:6px;background:var(--rose);color:#fff;font-size:8.5px;font-weight:700;border-radius:9999px;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;}

.more-sheet-list button{width:100%;display:flex;align-items:center;gap:12px;padding:13px 6px;border:none;background:none;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line-soft);text-align:left;}
.more-sheet-list button i{width:20px;color:var(--gold-deep);}
.more-sheet-list button:last-child{border-bottom:none;}

.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--ink);color:#f3ead0;padding:11px 20px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow-lift);animation:toastIn .25s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

@media (max-width:900px){
  .rail{display:none;}
  .topbar{display:flex;}
  .view{padding:18px 16px 90px;}
  .bottom-nav{display:block;}
  .tile-row{grid-template-columns:1fr 1fr;}
  .tile-row .tile-balance{grid-column:1 / -1;}
  .attend-stats{grid-template-columns:repeat(3,1fr);}
}
@media (max-width:520px){
  .hero{padding:22px 20px;}
  .hero .greet{font-size:22px;}
}
</style>
</head>
<body>

<div class="shell" id="shell">
  <aside class="rail" id="rail">
    <div class="rail-brand">
      <div class="mark" id="railMark">S</div>
      <div>
        <div class="name" id="railSchoolName">School</div>
        <div class="sub">Family Portal</div>
      </div>
    </div>
    <nav class="rail-nav" id="railNav"></nav>
    <div class="rail-foot">
      <div class="rail-child">
        <div class="rail-avatar" id="railAvatar">P</div>
        <select id="railChildSelect"></select>
      </div>
      <button class="rail-logout" onclick="Portal.logout()"><i class="fas fa-arrow-right-from-bracket"></i> Sign out</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="t-title" id="topTitle">Home</div>
      <div class="t-actions">
        <button class="icon-btn" onclick="Portal.openNotifications()"><i class="fas fa-bell"></i><span class="badge" id="mNotifBadge" style="display:none">0</span></button>
        <button class="t-avatar" id="topAvatar" onclick="Portal.openMore()">P</button>
      </div>
    </div>
    <main class="view" id="view"><div class="spinner"></div></main>
  </div>
</div>

<div class="sheet-overlay" id="notifSheet">
  <div class="sheet">
    <div class="sheet-head"><h3><i class="fas fa-bell" style="color:var(--gold-deep)"></i>&nbsp; Updates</h3><button onclick="Portal.closeSheet('notifSheet')">&times;</button></div>
    <div id="notifSheetBody"><div class="spinner"></div></div>
  </div>
</div>

<div class="sheet-overlay" id="moreSheet">
  <div class="sheet">
    <div class="sheet-head"><h3>More</h3><button onclick="Portal.closeSheet('moreSheet')">&times;</button></div>
    <div class="more-sheet-list" id="moreSheetList"></div>
  </div>
</div>

<div class="bottom-nav">
  <div class="bn-row" id="bottomNav"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ==================================================================
   FAMILY PORTAL — application
   Uses only working, existing API routes:
     GET  /api/school
     GET  /api/parent/students/:parentName
     GET  /api/students/:id
     GET  /api/academic/settings
     GET  /api/reports/report-card/:studentId/:term/:year
     GET  /api/students/:studentId/previous-balances
     GET  /api/attendance/student/:studentId/summary
     GET  /api/events , /api/events/categories , /api/announcements
     GET  /api/chat/contacts?type=director
     GET  /api/chat/messages/:contactId
     POST /api/chat/messages
     PUT  /api/chat/messages/:contactId/read
     GET  /api/chat/unread
   Deliberately does NOT call /api/parent/student/:id/details (broken
   server route referencing an undefined "reportFiles" variable).
   ================================================================== */
const Portal = (() => {

  const TABS = [
    { id:'home',        label:'Home',        icon:'fa-house',            primary:true  },
    { id:'academics',   label:'Academics',   icon:'fa-graduation-cap',   primary:true  },
    { id:'fees',        label:'Fees',        icon:'fa-coins',            primary:true  },
    { id:'attendance',  label:'Attendance',  icon:'fa-calendar-check',   primary:false },
    { id:'events',      label:'Events',      icon:'fa-calendar-days',    primary:false },
    { id:'news',        label:'News',        icon:'fa-bullhorn',         primary:false },
    { id:'messages',    label:'Messages',    icon:'fa-comment-dots',     primary:true  },
    { id:'profile',     label:'Profile',     icon:'fa-user',             primary:false },
  ];

  const state = {
    parentName:'',
    school:{ schoolName:'School', motto:'' },
    students:[],
    childId:null,
    studentCache:{},        // id -> full student payload from /api/students/:id
    balances:{},            // id -> previous-balances payload
    attendanceCache:{},     // id -> summary payload
    tab:'home',
    events:[],
    eventCategories:[],
    announcements:[],
    notifications:[],
    unread:0,
    adminContact:null,      // the single "director" chat contact
    chatUnread:0,
    chatPoll:null,
    academicSettings:{ currentYear:new Date().getFullYear(), currentTerm:1 },
    academicPeriod:{}       // childId -> {year, term}
  };

  // ---------------- helpers ----------------
  const esc = (s) => { if(s===undefined||s===null) return ''; const d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; };
  const money = (n) => 'UGX ' + Math.round(n||0).toLocaleString();
  const initials = (a,b) => ((a||'')[0]||'').toUpperCase() + ((b||'')[0]||'').toUpperCase();
  const avatarColor = (seed) => {
    const c=['#1f6f63','#8f671f','#b3435a','#3c4454','#6a4a91','#1f6f9a'];
    let h=0; for(let i=0;i<String(seed).length;i++) h=String(seed).charCodeAt(i)+((h<<5)-h);
    return c[Math.abs(h)%c.length];
  };
  async function api(path){
    const res = await fetch(path);
    if(!res.ok) throw new Error('Request failed: '+path);
    return res.json();
  }
  function toast(msg){
    const wrap = document.getElementById('toastWrap');
    const t = document.createElement('div');
    t.className='toast'; t.textContent=msg;
    wrap.appendChild(t);
    setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(10px)'; setTimeout(()=>t.remove(),250); },3000);
  }
  function gradeClass(g){ return 'g-'+(g||'F'); }
  function currentChild(){ return state.students.find(s=>s.id===state.childId) || state.students[0]; }
  function paymentStatus(it){
    if(it.isFullyPaid) return {c:'pill-teal', t:'Paid'};
    if((it.cashPaid||0) > 0 || (it.itemsBrought||0) > 0) return {c:'pill-amber', t:'Partial'};
    return {c:'pill-rose', t:'Unpaid'};
  }
  function paymentOptionLabel(po){
    if(po === 'cash_only') return 'Cash only';
    if(po === 'item_only') return 'Item only';
    return 'Cash or item';
  }

  // ---------------- boot ----------------
  async function init(){
    const name = localStorage.getItem('parentName');
    if(!name){ window.location.href='/parent-login.html'; return; }
    state.parentName = name;

    buildNav();

    try{
      const schoolRes = await api('/api/school');
      if(schoolRes && schoolRes.school) state.school = schoolRes.school;
    }catch(e){ /* non-fatal */ }
    applyBranding();

    try{
      const settings = await api('/api/academic/settings');
      if(settings){
        state.academicSettings.currentYear = settings.currentYear || state.academicSettings.currentYear;
        state.academicSettings.currentTerm = settings.currentTerm || state.academicSettings.currentTerm;
      }
    }catch(e){ /* fall back to defaults */ }

    try{
      const sres = await fetch(`/api/parent/students/${encodeURIComponent(name)}`);
      const sdata = await sres.json();
      state.students = (sdata.success && sdata.students) ? sdata.students : [];
    }catch(e){ console.error(e); }

    if(state.students.length){
      state.childId = state.students[0].id;
      populateChildSelectors();
    }

    loadEventsAndAnnouncements();
    loadAdminContact();

    renderTab('home');
  }

  function applyBranding(){
    document.title = (state.school.schoolName || 'School') + ' · Family Portal';
    document.getElementById('railSchoolName').textContent = state.school.schoolName || 'School';
    document.getElementById('railMark').textContent = (state.school.schoolName||'S').trim().charAt(0).toUpperCase();
    const initial = state.parentName.trim().charAt(0).toUpperCase();
    document.getElementById('railAvatar').textContent = initial;
    document.getElementById('topAvatar').textContent = initial;
  }

  function buildNav(){
    const rail = document.getElementById('railNav');
    rail.innerHTML = TABS.map(t=>`
      <button data-tab="${t.id}" onclick="Portal.renderTab('${t.id}')">
        <i class="fas ${t.icon}"></i><span>${t.label}</span><span class="dot" id="rdot-${t.id}"></span>
      </button>`).join('');

    const bottom = document.getElementById('bottomNav');
    const primary = TABS.filter(t=>t.primary);
    bottom.innerHTML = primary.map(t=>`
      <button data-tab="${t.id}" onclick="Portal.renderTab('${t.id}')">
        <i class="fas ${t.icon}"></i><span>${t.label}</span>
        ${t.id==='messages' ? '<span class="bnbadge" id="bnChatBadge" style="display:none">0</span>' : ''}
      </button>`).join('') + `
      <button data-tab="more" onclick="Portal.openMore()"><i class="fas fa-ellipsis"></i><span>More</span></button>`;
  }

  function populateChildSelectors(){
    const sel = document.getElementById('railChildSelect');
    sel.innerHTML = state.students.map(s=>`<option value="${s.id}">${esc(s.firstName)} ${esc(s.lastName)}</option>`).join('');
    sel.value = state.childId;
    sel.onchange = (e)=>{ switchChild(e.target.value); };
  }

  async function switchChild(id){
    state.childId = id;
    document.getElementById('railChildSelect').value = id;
    await renderTab(state.tab, true);
  }

  async function ensureStudent(id){
    if(state.studentCache[id]) return state.studentCache[id];
    try{
      const data = await api(`/api/students/${id}`);
      state.studentCache[id] = data;
      return data;
    }catch(e){ return null; }
  }
  async function ensureBalances(id){
    if(state.balances[id]) return state.balances[id];
    try{
      const data = await api(`/api/students/${id}/previous-balances`);
      if(data.success){ state.balances[id]=data; return data; }
    }catch(e){ console.warn('balances unavailable', e); }
    return null;
  }
  async function ensureAttendance(id){
    if(state.attendanceCache[id]) return state.attendanceCache[id];
    try{
      const data = await api(`/api/attendance/student/${id}/summary`);
      if(data.success){ state.attendanceCache[id]=data.summary; return data.summary; }
    }catch(e){}
    return { present:0, absent:0, total:0, rate:0 };
  }

  // ---------------- notifications feed ----------------
  async function loadEventsAndAnnouncements(){
    try{
      const [ev, cats, ann] = await Promise.all([
        api('/api/events').catch(()=>[]),
        api('/api/events/categories').catch(()=>[]),
        api('/api/announcements?active=true').catch(()=>({data:[]}))
      ]);
      state.events = Array.isArray(ev) ? ev : [];
      state.eventCategories = Array.isArray(cats) ? cats : [];
      state.announcements = (ann && ann.data) ? ann.data : [];
      buildNotifications();
      if(state.tab==='home') renderTab('home', true);
    }catch(e){ console.warn('feed load failed', e); }
  }

  function buildNotifications(){
    const today = new Date().toISOString().split('T')[0];
    const items = [];
    state.announcements.forEach(a=>{
      const aud = a.targetAudience||[];
      if(aud.length && !aud.includes('public') && !aud.includes('parent') && !aud.includes('parents')) return;
      items.push({ id:'a_'+a.id, title:a.title, desc:a.content, date:a.createdAt, type:'Announcement', icon:'fa-bullhorn', tint:'gold' });
    });
    state.events.filter(e=>e.startDate>=today && e.status==='published').forEach(e=>{
      items.push({ id:'e_'+e.id, title:e.title, desc:e.description||'Upcoming event', date:e.startDate, type:'Event', icon:'fa-calendar-days', tint:'teal' });
    });
    items.sort((a,b)=> new Date(b.date)-new Date(a.date));
    state.notifications = items;
    state.unread = items.length;
    const badge = document.getElementById('mNotifBadge');
    if(state.unread>0){ badge.style.display='flex'; badge.textContent = state.unread>9?'9+':state.unread; }
    else badge.style.display='none';
  }

  function openNotifications(){
    const overlay = document.getElementById('notifSheet');
    overlay.classList.add('show');
    const body = document.getElementById('notifSheetBody');
    if(!state.notifications.length){
      body.innerHTML = `<div class="empty"><i class="fas fa-bell-slash"></i><p>Nothing new right now.</p></div>`;
      return;
    }
    body.innerHTML = state.notifications.slice(0,25).map(n=>`
      <div class="feed-item">
        <div class="feed-ic" style="background:${n.tint==='gold'?'var(--gold-tint)':'var(--teal-tint)'};color:${n.tint==='gold'?'var(--gold-deep)':'var(--teal)'}"><i class="fas ${n.icon}"></i></div>
        <div class="feed-body">
          <p class="feed-title">${esc(n.title)}</p>
          <p class="feed-desc">${esc(n.desc)}</p>
          <div class="feed-date">${new Date(n.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${n.type}</div>
        </div>
      </div>`).join('');
    state.unread = 0;
    document.getElementById('mNotifBadge').style.display='none';
  }
  function closeSheet(id){ document.getElementById(id).classList.remove('show'); }

  function openMore(){
    const overlay = document.getElementById('moreSheet');
    overlay.classList.add('show');
    const secondary = TABS.filter(t=>!t.primary);
    const list = document.getElementById('moreSheetList');
    list.innerHTML = secondary.map(t=>`<button onclick="Portal.closeSheet('moreSheet'); Portal.renderTab('${t.id}')"><i class="fas ${t.icon}"></i> ${t.label}</button>`).join('')
      + `<button onclick="Portal.logout()"><i class="fas fa-arrow-right-from-bracket"></i> Sign out</button>`;
  }

  function logout(){
    if(!confirm('Sign out of the Family Portal?')) return;
    localStorage.removeItem('parentName');
    if(state.chatPoll) clearInterval(state.chatPoll);
    window.location.href='/parent-login.html';
  }

  // ---------------- tab router ----------------
  async function renderTab(tab, silent){
    state.tab = tab;
    document.querySelectorAll('[data-tab]').forEach(el=>el.classList.toggle('active', el.dataset.tab===tab));
    document.getElementById('topTitle').textContent = (TABS.find(t=>t.id===tab)||{}).label || 'Home';

    const view = document.getElementById('view');
    if(!silent) view.innerHTML = '<div class="spinner"></div>';

    if(!state.students.length){
      view.innerHTML = `<div class="empty"><i class="fas fa-user-slash"></i><p>No child is linked to this account yet.</p><p>Please contact the school office.</p></div>`;
      return;
    }

    try{
      switch(tab){
        case 'home': await renderHome(); break;
        case 'academics': await renderAcademics(); break;
        case 'fees': await renderFees(); break;
        case 'attendance': await renderAttendance(); break;
        case 'events': renderEvents(); break;
        case 'news': renderNews(); break;
        case 'messages': await renderMessages(); break;
        case 'profile': renderProfile(); break;
      }
      view.classList.remove('view-enter'); void view.offsetWidth; view.classList.add('view-enter');
    }catch(e){
      console.error(e);
      view.innerHTML = `<div class="empty"><i class="fas fa-triangle-exclamation"></i><p>Something didn't load. Pull to refresh or try again shortly.</p></div>`;
    }
  }

  function childChipStrip(){
    if(state.students.length<2) return '';
    return `<div class="child-strip">${state.students.map(s=>`
      <div class="child-chip ${s.id===state.childId?'active':''}" onclick="Portal.switchChildUI('${s.id}')">
        <div class="av" style="background:${avatarColor(s.id)}">${initials(s.firstName,s.lastName)}</div>
        <div><div class="cn">${esc(s.firstName)} ${esc(s.lastName)}</div><div class="cc">${esc(s.admissionNumber||'')}</div></div>
      </div>`).join('')}</div>`;
  }
  async function switchChildUI(id){ await switchChild(id); }

  // ================= HOME =================
  async function renderHome(){
    const view = document.getElementById('view');
    const child = currentChild();
    const [bal, attendance] = await Promise.all([ ensureBalances(child.id), ensureAttendance(child.id) ]);

    const hour = new Date().getHours();
    const greeting = hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';
    const firstName = state.parentName.split(' ')[0];

    const balanceTotal = bal ? (bal.currentPeriod?.total?.balance||0) + (bal.totalPreviousBalance||0) : 0;

    let latestAvg = null, latestGrade = null;
    try{
      const rc = await api(`/api/reports/report-card/${child.id}/${state.academicSettings.currentTerm}/${state.academicSettings.currentYear}`);
      latestAvg = rc.summary?.average; latestGrade = rc.summary?.grade;
    }catch(e){}

    const today = new Date().toISOString().split('T')[0];
    const upcoming = state.events.filter(e=>e.startDate>=today && e.status==='published').sort((a,b)=>a.startDate.localeCompare(b.startDate)).slice(0,3);
    const recentAnnouncements = state.announcements.slice(0,3);

    view.innerHTML = `
      <div class="hero">
        <p class="greet">${greeting}, ${esc(firstName)}</p>
        <p class="greet-sub">Here's where things stand for ${esc(child.firstName)} today — fees, attendance, and everything the school has shared recently.</p>
        <div class="hero-gold-rule"></div>
      </div>

      ${childChipStrip()}

      <div class="tile-row">
        <div class="tile tile-balance">
          <div class="tk">Outstanding balance</div>
          <div class="tv">${money(balanceTotal)}</div>
          <div class="ts">${balanceTotal>0 ? 'across current & prior periods' : 'account settled — nicely done'}</div>
        </div>
        <div class="tile tile-attend">
          <div class="tk">Attendance</div>
          <div class="tv">${attendance.rate||0}%</div>
          <div class="ts">${attendance.present||0} present / ${attendance.total||0} days</div>
        </div>
        <div class="tile tile-grade">
          <div class="tk">Latest average</div>
          <div class="tv">${latestAvg!==null && !isNaN(latestAvg) ? Math.round(latestAvg)+'%' : '—'}</div>
          <div class="ts">${latestGrade ? 'Grade '+latestGrade : 'no marks yet'}</div>
        </div>
      </div>

      <div class="card pad" style="margin-bottom:16px;">
        <div class="section-title">Recent news <span class="link" onclick="Portal.renderTab('news')">See all</span></div>
        ${recentAnnouncements.length ? recentAnnouncements.map(a=>`
          <div class="feed-item">
            <div class="feed-ic" style="background:var(--gold-tint);color:var(--gold-deep)"><i class="fas fa-bullhorn"></i></div>
            <div class="feed-body">
              <p class="feed-title">${esc(a.title)}</p>
              <p class="feed-desc">${esc(a.content)}</p>
              <div class="feed-date">${new Date(a.createdAt).toLocaleDateString()}</div>
            </div>
          </div>`).join('') : `<p style="color:var(--muted);font-size:13px;margin:0;">No announcements yet — check back soon.</p>`}
      </div>

      <div class="card pad">
        <div class="section-title">Coming up <span class="link" onclick="Portal.renderTab('events')">Full calendar</span></div>
        ${upcoming.length ? upcoming.map(e=>`
          <div class="feed-item">
            <div class="feed-ic" style="background:${(e.color||'#1f6f63')+'22'};color:${e.color||'#1f6f63'}"><i class="fas fa-calendar-day"></i></div>
            <div class="feed-body">
              <p class="feed-title">${esc(e.title)}</p>
              <p class="feed-desc">${esc(e.location||e.description||'')}</p>
              <div class="feed-date">${new Date(e.startDate).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}${e.startTime? ' · '+e.startTime:''}</div>
            </div>
          </div>`).join('') : `<p style="color:var(--muted);font-size:13px;margin:0;">Nothing scheduled at the moment.</p>`}
      </div>
    `;
  }

  // ================= ACADEMICS =================
  async function renderAcademics(){
    const view = document.getElementById('view');
    const child = currentChild();

    if(!state.academicPeriod[child.id]){
      state.academicPeriod[child.id] = { year: state.academicSettings.currentYear, term: state.academicSettings.currentTerm };
    }
    const period = state.academicPeriod[child.id];
    const nowYear = state.academicSettings.currentYear;
    const yearOptions = [nowYear, nowYear-1, nowYear-2];

    view.innerHTML = `
      <div class="page-head"><h1 class="serif">Academics</h1><p>${esc(child.firstName)}'s subject performance, term by term.</p></div>
      ${childChipStrip()}
      <div class="term-bar">
        <select class="select" id="yearSelect" onchange="Portal.changeAcadPeriod()">
          ${yearOptions.map(y=>`<option value="${y}" ${y===period.year?'selected':''}>${y}</option>`).join('')}
        </select>
        <select class="select" id="termSelect" onchange="Portal.changeAcadPeriod()">
          ${[1,2,3].map(t=>`<option value="${t}" ${t===period.term?'selected':''}>Term ${t}</option>`).join('')}
        </select>
      </div>
      <div id="acadBody"><div class="spinner"></div></div>
    `;
    await paintAcademicPeriod();
  }

  async function paintAcademicPeriod(){
    const child = currentChild();
    const period = state.academicPeriod[child.id];
    const body = document.getElementById('acadBody');
    if(!body) return;

    let rc = null;
    try{ rc = await api(`/api/reports/report-card/${child.id}/${period.term}/${period.year}`); }catch(e){}

    const results = (rc && rc.results) || [];
    const summary = (rc && rc.summary) || {average:0,grade:'—',totalSubjects:0,remark:''};
    const pct = Math.max(0, Math.min(100, Math.round(summary.average||0)));
    const ringColor = pct>=80?'#1f7a3d':pct>=60?'#1f6f63':pct>=40?'#c07a1f':'#b3435a';

    body.innerHTML = `
      <div class="card pad" style="margin-bottom:16px;">
        <div class="grade-ring-wrap">
          <div class="grade-ring" style="background:conic-gradient(${ringColor} ${pct*3.6}deg, var(--paper-deep) 0deg)">
            <div class="inner"><b>${pct}%</b><span>average</span></div>
          </div>
          <div>
            <div style="font-family:'Fraunces',serif;font-size:20px;font-weight:600;">Grade ${esc(summary.grade||'—')}</div>
            <div style="font-size:13px;color:var(--muted);margin-top:2px;">${esc(summary.remark||'')} · ${summary.totalSubjects||0} subject${(summary.totalSubjects||0)===1?'':'s'} assessed</div>
          </div>
        </div>
      </div>

      <div class="card pad">
        <div class="section-title">Subjects</div>
        ${results.length ? results.map(r=>`
          <div class="subject-row">
            <div><div class="subject-name">${esc(r.subjectName)}</div><div class="subject-score">${r.score}% · ${esc(r.remark||'')}</div></div>
            <div class="grade-chip ${gradeClass(r.grade)}">${esc(r.grade)}</div>
          </div>`).join('') : `<p style="color:var(--muted);font-size:13px;">No subject marks recorded for this term yet.</p>`}
      </div>
    `;
  }

  async function changeAcadPeriod(){
    const child = currentChild();
    const year = parseInt(document.getElementById('yearSelect').value);
    const term = parseInt(document.getElementById('termSelect').value);
    state.academicPeriod[child.id] = { year, term };
    document.getElementById('acadBody').innerHTML = '<div class="spinner"></div>';
    await paintAcademicPeriod();
  }

  // ================= FEES =================
  // Rule: the top-level "expected / paid / balance" summary counts ONLY
  // tuition plus items whose paymentOption is "cash_only". Items that can
  // be settled either with cash OR by bringing the physical item
  // ("either" / "item_only") are excluded from that top total and are
  // shown only inside their own status group, with their own remaining
  // money + remaining item count. Expanding a status group always lists
  // every item in it (name, cost, qty, payment option, payment status).
  async function renderFees(){
    const view = document.getElementById('view');
    const child = currentChild();
    const bal = await ensureBalances(child.id);

    view.innerHTML = `
      <div class="page-head"><h1 class="serif">Fees & Payments</h1><p>${esc(child.firstName)}'s billing for the current term, plus anything carried forward.</p></div>
      ${childChipStrip()}
      <div id="feesBody"></div>
    `;
    const body = document.getElementById('feesBody');

    if(!bal || !bal.currentPeriod){
      body.innerHTML = `<div class="empty"><i class="fas fa-coins"></i><p>No fee structure is assigned to ${esc(child.firstName)} yet.</p></div>`;
      return;
    }

    const cp = bal.currentPeriod;
    const groups = Object.values(cp.statusGroupBreakdown || {});

    // ---- top-level total: tuition + cash_only items only ----
    let topExpected = cp.tuition.expected || 0;
    let topPaid = cp.tuition.paid || 0;
    groups.forEach(g=>{
      (g.items||[]).forEach(it=>{
        if(it.paymentOption === 'cash_only'){
          topExpected += it.totalAmount || 0;
          topPaid += it.cashPaid || 0;
        }
      });
    });
    const topBalance = topExpected - topPaid;
    const totalPct = topExpected>0 ? Math.min(100, Math.round((topPaid/topExpected)*100)) : (topPaid>0?100:0);
    const ringColor = totalPct>=100?'var(--teal)':totalPct>=50?'var(--gold)':'var(--rose)';

    let previousHtml = '';
    if(bal.totalPreviousBalance > 0 && bal.previousPeriods?.length){
      previousHtml = `
        <div class="balance-banner">
          <i class="fas fa-triangle-exclamation"></i>
          <div><div class="bb-title">${money(bal.totalPreviousBalance)} carried forward</div>
          <div class="bb-sub">From ${bal.previousPeriods.length} earlier period${bal.previousPeriods.length===1?'':'s'} — see below for the breakdown.</div></div>
        </div>
        ${bal.previousPeriods.map((p,i)=>renderPeriodAccordion(p, `prev-${i}`)).join('')}
      `;
    }

    body.innerHTML = `
      <div class="card pad" style="margin-bottom:16px;">
        <div class="donut-wrap">
          <div class="donut" style="background:conic-gradient(${ringColor} ${totalPct*3.6}deg, var(--paper-deep) 0deg)"><div class="hole"><b>${totalPct}%</b><span>settled</span></div></div>
          <div style="flex:1;">
            <div class="money-row"><span>Expected (tuition + fixed-price items)</span><b>${money(topExpected)}</b></div>
            <div class="money-row"><span>Paid</span><b>${money(topPaid)}</b></div>
            <div class="money-row"><span>Balance</span><b style="color:${topBalance>0?'var(--rose)':'var(--teal)'}">${money(topBalance)}</b></div>
          </div>
        </div>
        <p style="font-size:11.5px;color:var(--muted);margin:12px 0 0;">Items that can be paid either in cash or brought in physically aren't included in this total — check the group below for those.</p>
      </div>

      <div class="card pad" style="margin-bottom:16px;">
        <div class="section-title">Tuition</div>
        <div class="money-row"><span>Expected</span><b>${money(cp.tuition.expected)}</b></div>
        <div class="money-row"><span>Paid</span><b>${money(cp.tuition.paid)}</b></div>
        <div class="money-row"><span>Balance</span><b style="color:${cp.tuition.balance>0?'var(--rose)':'var(--teal)'}">${money(cp.tuition.balance)}</b></div>
        ${cp.tuition.bursaryName ? `<div style="margin-top:8px;"><span class="pill pill-gold"><i class="fas fa-award"></i> ${esc(cp.tuition.bursaryName)} applied</span></div>` : ''}
      </div>

      ${previousHtml}

      ${groups.length ? `<div class="section-title" style="margin-top:4px;">This term's items</div>` : ''}
      ${groups.map((g,i)=>renderGroupAccordion(g,`cur-${i}`)).join('')}

      ${renderPaymentHistory(cp.payments || [])}
    `;
  }

  function groupFlaggedStats(g){
    // money + item units still owed, counted ONLY from items that are
    // NOT cash_only (those already live in the top summary)
    let balance = 0, itemsRemaining = 0, hasFlagged = false;
    (g.items||[]).forEach(it=>{
      if(it.paymentOption !== 'cash_only'){
        hasFlagged = true;
        balance += Math.max(0, it.remainingAmount||0);
        itemsRemaining += Math.max(0, it.remainingQuantity||0);
      }
    });
    return { balance, itemsRemaining, hasFlagged };
  }

  function renderGroupAccordion(g, key){
    const items = g.items || [];
    const flagged = groupFlaggedStats(g);
    const headerRight = flagged.hasFlagged
      ? `${money(flagged.balance)} remaining · ${flagged.itemsRemaining} item${flagged.itemsRemaining===1?'':'s'}`
      : `${money(g.paid)} / ${money(g.expected)}`;

    return `
      <div class="accordion" id="acc-${key}">
        <div class="accordion-head" onclick="Portal.toggleAcc('${key}')">
          <span>${esc(g.name)}</span>
          <span class="ah-right">${headerRight} <i class="fas fa-chevron-down chev"></i></span>
        </div>
        <div class="accordion-body">
          ${items.map(it=>{
            const status = paymentStatus(it);
            return `<div class="item-line">
              <div>
                <div class="il-name">${esc(it.itemName)}</div>
                <div class="il-sub">Qty ${it.quantity||1} · ${money(it.totalAmount||0)} · ${esc(paymentOptionLabel(it.paymentOption))}</div>
              </div>
              <span class="pill ${status.c}">${status.t}</span>
            </div>`;
          }).join('') || `<p style="color:var(--muted);font-size:12.5px;padding:8px 0;">No items in this group.</p>`}
        </div>
      </div>`;
  }

  function renderPeriodAccordion(p, key){
    const groups = Object.values(p.statusGroupBreakdown || {});
    return `
      <div class="accordion" id="acc-${key}">
        <div class="accordion-head" onclick="Portal.toggleAcc('${key}')">
          <span><i class="fas fa-clock-rotate-left" style="margin-right:6px;color:var(--rose)"></i>Term ${p.term} · ${p.year}</span>
          <span class="ah-right">${money(p.total.balance)} due <i class="fas fa-chevron-down chev"></i></span>
        </div>
        <div class="accordion-body">
          <div class="money-row"><span>Tuition balance</span><b>${money(p.tuition.balance)}</b></div>
          ${groups.map(g=>{
            const items = (g.items||[]).filter(it=>!it.isFullyPaid);
            if(!items.length) return '';
            return `<div style="font-weight:700;font-size:12.5px;margin:10px 0 4px;">${esc(g.name)}</div>` +
              items.map(it=>{
                const status = paymentStatus(it);
                return `<div class="item-line">
                  <div>
                    <div class="il-name">${esc(it.itemName)}</div>
                    <div class="il-sub">Qty ${it.quantity||1} · ${money(it.totalAmount||0)} · ${esc(paymentOptionLabel(it.paymentOption))}</div>
                  </div>
                  <span class="pill ${status.c}">${money(it.remainingAmount||0)} due</span>
                </div>`;
              }).join('');
          }).join('')}
        </div>
      </div>`;
  }

  function renderPaymentHistory(payments){
    if(!payments || !payments.length) return '';
    const sorted = [...payments].sort((a,b)=> new Date(b.date)-new Date(a.date));
    return `
      <div class="card pad" style="margin-top:16px;">
        <div class="section-title">Payment history</div>
        ${sorted.slice(0,12).map(p=>`
          <div class="payment-row">
            <div><div class="pr-receipt">${esc(p.receiptNumber||'—')}</div><div class="pr-date">${new Date(p.date).toLocaleDateString()} · ${esc(p.method||'cash')}</div></div>
            <b style="color:var(--teal)">${money(p.amount ?? 0)}</b>
          </div>`).join('')}
      </div>`;
  }

  function toggleAcc(key){
    const el = document.getElementById('acc-'+key);
    if(el) el.classList.toggle('open');
  }

  // ================= ATTENDANCE =================
  async function renderAttendance(){
    const view = document.getElementById('view');
    const child = currentChild();
    let recordsData = null;
    try{ recordsData = await api(`/api/attendance/student/${child.id}/summary`); }catch(e){}
    const records = (recordsData && recordsData.records) || [];
    const summary = (recordsData && recordsData.summary) || {present:0,absent:0,total:0,rate:0};

    state._attendMonth = state._attendMonth || new Date();
    state._attendRecords = records;

    view.innerHTML = `
      <div class="page-head"><h1 class="serif">Attendance</h1><p>Day-by-day record for ${esc(child.firstName)}.</p></div>
      ${childChipStrip()}
      <div class="attend-stats">
        <div class="astat" style="background:var(--teal-tint);color:var(--teal)"><b>${summary.present||0}</b><span>Present</span></div>
        <div class="astat" style="background:var(--rose-tint);color:var(--rose)"><b>${summary.absent||0}</b><span>Absent</span></div>
        <div class="astat" style="background:var(--gold-tint);color:var(--gold-deep)"><b>${summary.rate||0}%</b><span>Attendance rate</span></div>
      </div>
      <div class="card pad">
        <div class="cal-head">
          <button class="btn btn-ghost" onclick="Portal.shiftMonth(-1)"><i class="fas fa-chevron-left"></i></button>
          <div style="font-weight:700;font-family:'Fraunces',serif;font-size:15px;" id="calLabel"></div>
          <button class="btn btn-ghost" onclick="Portal.shiftMonth(1)"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    `;
    paintCalendar(records);
  }

  function shiftMonth(delta){
    state._attendMonth.setMonth(state._attendMonth.getMonth()+delta);
    paintCalendar(state._attendRecords || []);
  }

  function paintCalendar(records){
    const m = state._attendMonth;
    document.getElementById('calLabel').textContent = m.toLocaleDateString(undefined,{month:'long',year:'numeric'});
    const byDate = {};
    records.forEach(r=>{ byDate[r.date] = r.present ? 'present' : 'absent'; });

    const firstDay = new Date(m.getFullYear(), m.getMonth(), 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
    const dows = ['S','M','T','W','T','F','S'];

    let html = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
    for(let i=0;i<startOffset;i++) html += `<div class="cal-cell empty"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const status = byDate[dateStr];
      html += `<div class="cal-cell ${status||''}">${d}</div>`;
    }
    document.getElementById('calGrid').innerHTML = html;
  }

  // ================= EVENTS =================
  function renderEvents(){
    const view = document.getElementById('view');
    state._eventFilter = state._eventFilter || 'all';
    view.innerHTML = `
      <div class="page-head"><h1 class="serif">School Calendar</h1><p>Everything on the school's schedule.</p></div>
      <div class="filter-row" id="evFilters"></div>
      <div id="evList"></div>
    `;
    const cats = ['all', ...new Set(state.events.map(e=>e.category).filter(Boolean))];
    document.getElementById('evFilters').innerHTML = cats.map(c=>`
      <button class="chip-filter ${state._eventFilter===c?'active':''}" onclick="Portal.filterEvents('${c}')">${c==='all'?'All':esc(c)}</button>
    `).join('');
    paintEvents();
  }
  function filterEvents(c){ state._eventFilter = c; renderEvents(); }
  function paintEvents(){
    const list = document.getElementById('evList');
    let evs = state.events.filter(e=>e.status==='published');
    if(state._eventFilter && state._eventFilter!=='all') evs = evs.filter(e=>e.category===state._eventFilter);
    evs.sort((a,b)=> a.startDate.localeCompare(b.startDate));
    if(!evs.length){ list.innerHTML = `<div class="empty"><i class="fas fa-calendar-xmark"></i><p>No events in this category.</p></div>`; return; }
    list.innerHTML = evs.map(e=>{
      const dt = new Date(e.startDate);
      return `<div class="event-card">
        <div class="event-date-block" style="background:${(e.color||'#1f6f63')+'22'}">
          <div class="mon">${dt.toLocaleDateString(undefined,{month:'short'})}</div>
          <div class="day" style="color:${e.color||'#1f6f63'}">${dt.getDate()}</div>
        </div>
        <div class="event-info">
          <h4>${esc(e.title)}</h4>
          <p>${esc(e.description||'')}</p>
          <div class="event-meta">
            ${e.startTime?`<span><i class="far fa-clock"></i> ${esc(e.startTime)}</span>`:''}
            ${e.location?`<span><i class="fas fa-location-dot"></i> ${esc(e.location)}</span>`:''}
            <span class="pill pill-muted">${esc(e.category||'General')}</span>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  // ================= NEWS (announcements) =================
  function renderNews(){
    const view = document.getElementById('view');
    view.innerHTML = `
      <div class="page-head"><h1 class="serif">News from School</h1><p>Announcements shared by the administration.</p></div>
      <div id="newsList"></div>
    `;
    const list = document.getElementById('newsList');
    if(!state.announcements.length){
      list.innerHTML = `<div class="empty"><i class="fas fa-bullhorn"></i><p>No announcements yet.</p></div>`;
      return;
    }
    list.innerHTML = state.announcements.map(a=>`
      <div class="announce-card">
        <h4>${esc(a.title)}</h4>
        <p>${esc(a.content)}</p>
        <div class="announce-meta">
          <span style="font-size:11.5px;color:var(--muted)">${new Date(a.createdAt).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</span>
          ${a.importance==='Urgent'||a.importance==='High' ? `<span class="pill pill-rose">${esc(a.importance)}</span>` : `<span class="pill pill-muted">${esc(a.category||'General')}</span>`}
        </div>
      </div>`).join('');
  }

  // ================= MESSAGES (admin/director only) =================
  async function loadAdminContact(){
    try{
      const contacts = await api('/api/chat/contacts?type=director');
      state.adminContact = (contacts && contacts.length) ? contacts[0] : null;
    }catch(e){ state.adminContact = null; }
    loadChatUnread();
  }

  async function renderMessages(){
    const view = document.getElementById('view');
    if(!state.adminContact){
      await loadAdminContact();
    }
    if(!state.adminContact){
      view.innerHTML = `
        <div class="page-head"><h1 class="serif">Messages</h1><p>Reach the school office directly.</p></div>
        <div class="empty"><i class="fas fa-circle-user"></i><p>No school administrator is set up to receive messages yet.</p><p>Please call or visit the school office.</p></div>
      `;
      return;
    }

    view.innerHTML = `
      <div class="page-head"><h1 class="serif">Messages</h1><p>You're messaging the school office. Only the administration can reply here.</p></div>
      <div class="msg-shell">
        <div class="msg-thread-head">
          <div class="av" style="background:${avatarColor(state.adminContact.id)}">${initials(...state.adminContact.name.split(' '))}</div>
          ${esc(state.adminContact.name)}
        </div>
        <div class="msg-scroll" id="msgScroll"><div class="spinner"></div></div>
        <div class="msg-input-row">
          <input type="text" id="msgInput" placeholder="Write a message…" onkeydown="if(event.key==='Enter') Portal.sendMsg()">
          <button class="msg-send" onclick="Portal.sendMsg()"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    `;
    await loadThread();

    if(state.chatPoll) clearInterval(state.chatPoll);
    state.chatPoll = setInterval(()=>{ if(state.tab==='messages') loadThread(true); loadChatUnread(); }, 6000);
  }

  async function loadThread(silent){
    if(!state.adminContact) return;
    const scroll = document.getElementById('msgScroll');
    if(!scroll) return;
    let msgs = [];
    try{ msgs = await api(`/api/chat/messages/${state.adminContact.id}?limit=60`); }catch(e){}
    const bubbles = msgs.map(m=>`
      <div class="bubble ${m.sender==='admin'?'them':'me'}">${esc(m.message)}<span class="btime">${new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></div>
    `).join('');
    scroll.innerHTML = bubbles || '<p style="color:var(--muted);font-size:13px;text-align:center;margin-top:20px;">Say hello 👋</p>';
    scroll.scrollTop = scroll.scrollHeight;
    try{ await fetch(`/api/chat/messages/${state.adminContact.id}/read`, {method:'PUT'}); loadChatUnread(); }catch(e){}
  }

  async function sendMsg(){
    const input = document.getElementById('msgInput');
    if(!input || !state.adminContact) return;
    const message = input.value.trim();
    if(!message) return;
    input.value=''; input.disabled=true;
    try{
      await fetch('/api/chat/messages', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ contactId: state.adminContact.id, message, sender: state.parentName, messageType:'text' })
      });
      await loadThread(true);
    }catch(e){ toast('Message failed to send'); }
    finally{ input.disabled=false; input.focus(); }
  }

  async function loadChatUnread(){
    if(!state.adminContact) return;
    try{
      const d = await api('/api/chat/unread');
      state.chatUnread = (d.unreadByContact && d.unreadByContact[state.adminContact.id]) || 0;
      const badge = document.getElementById('bnChatBadge');
      const dot = document.getElementById('rdot-messages');
      if(badge){ if(state.chatUnread>0){ badge.style.display='flex'; badge.textContent = state.chatUnread>9?'9+':state.chatUnread; } else badge.style.display='none'; }
      if(dot) dot.parentElement.classList.toggle('has-alert', state.chatUnread>0);
    }catch(e){}
  }

  // ================= PROFILE =================
  function renderProfile(){
    const view = document.getElementById('view');
    view.innerHTML = `
      <div class="page-head"><h1 class="serif">Your profile</h1><p>Account details and the children linked to it.</p></div>

      <div class="card pad" style="margin-bottom:16px;">
        <div class="section-title">Guardian</div>
        <div class="info-line"><span>Name</span><span>${esc(state.parentName)}</span></div>
        <div class="info-line"><span>School</span><span>${esc(state.school.schoolName||'—')}</span></div>
      </div>

      <div class="card pad" style="margin-bottom:16px;">
        <div class="section-title">Children</div>
        ${state.students.map(s=>`
          <div class="profile-child-row">
            <div class="av">${initials(s.firstName,s.lastName)}</div>
            <div style="flex:1;">
              <div style="font-weight:700;font-size:14px;">${esc(s.firstName)} ${esc(s.lastName)}</div>
              <div style="font-size:12px;color:var(--muted)">${esc(s.admissionNumber||'')} · ${esc(s.status||'Active')}</div>
            </div>
            <span class="pill ${s.id===state.childId?'pill-gold':'pill-muted'}">${s.id===state.childId?'Viewing':'Switch'}</span>
          </div>
        `).join('')}
      </div>

      <div class="card pad" style="margin-bottom:16px;">
        <div class="section-title">Need something changed?</div>
        <p style="font-size:13px;color:var(--muted);margin:0;">To update contact details, phone numbers, or add another child to this account, please reach out to the school office directly.</p>
      </div>

      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="Portal.logout()"><i class="fas fa-arrow-right-from-bracket"></i> Sign out</button>
    `;
  }

  // ---------------- public API ----------------
  return {
    init, renderTab, switchChildUI, changeAcadPeriod, toggleAcc,
    shiftMonth, filterEvents, sendMsg,
    openNotifications, closeSheet, openMore, logout
  };
})();

document.addEventListener('DOMContentLoaded', Portal.init);
</script>
