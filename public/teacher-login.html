<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Login | School Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #667eea);
            background-size: 200% 100%;
            animation: gradientMove 3s ease-in-out infinite;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-header .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 36px;
            color: white;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
            transition: transform 0.3s ease;
        }

        .login-header .logo:hover {
            transform: scale(1.05) rotate(-5deg);
        }

        .login-header h1 {
            font-size: 26px;
            color: #1a202c;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: #718096;
            font-size: 14px;
            margin-top: 6px;
        }

        .login-header .hint {
            color: #a0aec0;
            font-size: 13px;
            margin-top: 10px;
            background: #f7fafc;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid #e2e8f0;
        }

        .login-header .hint i {
            color: #667eea;
            margin-right: 6px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: #e53e3e;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .form-group .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f7fafc;
            color: #2d3748;
        }

        .form-group .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group .input-wrapper input:focus + i {
            color: #667eea;
        }

        .form-group .input-wrapper input::placeholder {
            color: #a0aec0;
        }

        .form-group .input-hint {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-group .input-hint i {
            font-size: 12px;
            color: #a0aec0;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .login-btn.loading .spinner {
            display: inline-block;
        }

        .login-btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message-container {
            margin-bottom: 20px;
        }

        .message {
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            align-items: flex-start;
            gap: 10px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.show {
            display: flex;
        }

        .message i {
            font-size: 18px;
            margin-top: 1px;
            flex-shrink: 0;
        }

        .message.error {
            background: #fff5f5;
            border: 1px solid #feb2b2;
            color: #c53030;
        }

        .message.error i {
            color: #e53e3e;
        }

        .message.success {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            color: #276749;
        }

        .message.success i {
            color: #38a169;
        }

        .login-footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }

        .login-footer p {
            color: #718096;
            font-size: 13px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #718096;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #667eea;
        }

        .back-link i {
            margin-right: 6px;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 20px;
            }
            
            .login-header h1 {
                font-size: 22px;
            }

            .login-header .logo {
                width: 64px;
                height: 64px;
                font-size: 28px;
            }

            .form-group .input-wrapper input {
                padding: 12px 16px 12px 40px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-chalkboard-user"></i>
            </div>
            <h1>Teacher Login</h1>
            <p>Access your teacher portal</p>
            <div class="hint">
                <i class="fas fa-info-circle"></i> Enter your first name OR last name
            </div>
        </div>

        <!-- Messages -->
        <div class="message-container">
            <div id="errorMessage" class="message error">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Invalid credentials</span>
            </div>
            <div id="successMessage" class="message success">
                <i class="fas fa-check-circle"></i>
                <span id="successText">Login successful!</span>
            </div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" autocomplete="off" novalidate>
            <div class="form-group">
                <label for="name">
                    <i class="fas fa-user"></i> Your Name <span class="required">*</span>
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-user-circle"></i>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="Enter your first name or last name"
                        required
                        autocomplete="username"
                    />
                </div>
                <div class="input-hint">
                    <i class="fas fa-lightbulb"></i> Use either your first name or your last name
                </div>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password <span class="required">*</span>
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-key"></i>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    />
                    <button type="button" class="password-toggle" id="passwordToggle">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="input-hint">
                    <i class="fas fa-shield-alt"></i> Enter the password provided by the administrator
                </div>
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
                <span class="spinner"></span>
                <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Sign In</span>
            </button>
        </form>

        <!-- Footer -->
        <div class="login-footer">
            <p>Contact your administrator if you don't have credentials</p>
        </div>

        <a href="/" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to School Portal
        </a>
    </div>

    <script>
        // ==================== SIMPLIFIED TEACHER LOGIN ====================
        (function() {
            'use strict';

            console.log('🚀 Teacher Login Portal loaded');

            // DOM Elements
            const loginForm = document.getElementById('loginForm');
            const nameInput = document.getElementById('name');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const passwordToggle = document.getElementById('passwordToggle');

            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const errorText = document.getElementById('errorText');
            const successText = document.getElementById('successText');

            // ==================== PASSWORD TOGGLE ====================
            passwordToggle.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                const icon = this.querySelector('i');
                icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
            });

            // ==================== HIDE ALL MESSAGES ====================
            function hideAllMessages() {
                errorMessage.classList.remove('show');
                successMessage.classList.remove('show');
            }

            // ==================== SHOW ERROR ====================
            function showError(message) {
                hideAllMessages();
                errorText.textContent = message;
                errorMessage.classList.add('show');
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 5000);
            }

            // ==================== SHOW SUCCESS ====================
            function showSuccess(message) {
                hideAllMessages();
                successText.textContent = message;
                successMessage.classList.add('show');
            }

            // ==================== SET LOADING STATE ====================
            function setLoading(loading) {
                if (loading) {
                    loginBtn.classList.add('loading');
                    loginBtn.disabled = true;
                } else {
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                }
            }

            // ==================== HANDLE LOGIN SUBMIT ====================
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const name = nameInput.value.trim();
                const password = passwordInput.value.trim();

                hideAllMessages();

                if (!name) {
                    showError('Please enter your name');
                    nameInput.focus();
                    return;
                }

                if (!password) {
                    showError('Please enter your password');
                    passwordInput.focus();
                    return;
                }

                setLoading(true);

                try {
                    const response = await fetch('/api/teachers/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            name: name,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        showSuccess(data.message || 'Login successful!');

                        // Store teacher data (simple storage, no session verification)
                        localStorage.setItem('teacherData', JSON.stringify(data.teacher));
                        localStorage.setItem('teacherLoginTime', new Date().toISOString());

                        console.log('✅ Login successful for:', data.teacher.firstName, data.teacher.lastName);

                        // Redirect to dashboard
                        const redirectUrl = data.redirectUrl || '/teacher-dashboard.html';
                        setTimeout(() => {
                            window.location.href = redirectUrl;
                        }, 1000);

                    } else {
                        showError(data.error || 'Invalid credentials. Please check your name and password.');
                        passwordInput.value = '';
                        passwordInput.focus();
                        setLoading(false);
                    }

                } catch (error) {
                    console.error('Login error:', error);
                    showError('Network error. Please check your connection and try again.');
                    setLoading(false);
                }
            });

            // ==================== KEYBOARD SHORTCUTS ====================
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    hideAllMessages();
                }
            });

            // ==================== FOCUS ====================
            nameInput.focus();

            nameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    passwordInput.focus();
                }
            });

            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    loginForm.dispatchEvent(new Event('submit'));
                }
            });

            console.log('✅ Teacher Login Portal ready');
            console.log('ℹ️ Use your first name OR last name + password');

        })();
    </script>

</body>
</html>
